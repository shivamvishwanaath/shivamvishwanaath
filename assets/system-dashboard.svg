<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="dashScan" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes barCpu {
      0%, 100% { width: 55px; }
      50% { width: 85px; }
    }
    @keyframes barDisk {
      0%, 100% { width: 140px; }
      50% { width: 148px; }
    }
    @keyframes barNet {
      0%, 100% { width: 60px; }
      50% { width: 110px; }
    }
    @keyframes pulseGlowGreen {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #00ff41); }
      50% { opacity: 0.3; filter: none; }
    }
    @keyframes pulseGlowCyan {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #00f0ff); }
      50% { opacity: 0.35; filter: none; }
    }

    .hud-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .led-g { animation: pulseGlowGreen 2s infinite ease-in-out; }
    .led-c { animation: pulseGlowCyan 2.4s infinite ease-in-out; }
    .cpu-anim { animation: barCpu 4s ease-in-out infinite; }
    .disk-anim { animation: barDisk 6s ease-in-out infinite; }
    .net-anim { animation: barNet 3s ease-in-out infinite; }
  </style>

  <!-- Outer Frame -->
  <rect width="1200" height="340" rx="8" fill="url(#dashBg)" stroke="#00ff41" stroke-width="1.4" stroke-opacity="0.75" />

  <!-- Top Title Bar -->
  <path d="M 0 8 Q 0 0 8 0 L 1192 0 Q 1200 0 1200 8 L 1200 42 L 0 42 Z" fill="#0c121e" stroke="#00ff41" stroke-width="0.8" stroke-opacity="0.4" />
  <circle cx="26" cy="21" r="5.5" fill="#00ff41" class="led-g" />
  <text x="44" y="26" fill="#00ff41" class="hud-text" font-size="15" font-weight="bold" letter-spacing="1.5">
    HELIOS OPERATIONS CENTER // solcielo-vps01.thesci.co.in
  </text>
  <text x="1170" y="26" text-anchor="end" fill="#8b949e" class="hud-text" font-size="13.5" font-weight="600">
    UPTIME: 347d 14h 22m · CLUSTER STATUS: OPTIMAL
  </text>

  <!-- PANEL 1: NODE SPECIFICATION (Left) -->
  <g transform="translate(25, 58)">
    <rect width="360" height="225" rx="5" fill="#090e18" stroke="#1f293d" stroke-width="1.1" />
    <path d="M 0 5 Q 0 0 5 0 L 355 0 Q 360 0 360 5 L 360 32 L 0 32 Z" fill="#0e1726" />
    <text x="14" y="22" fill="#00f0ff" class="hud-text" font-size="14" font-weight="bold" letter-spacing="1">
      [01] BARE-METAL NODE SPECS
    </text>

    <!-- Node specs lines (+25% font size: 14.5px) -->
    <g transform="translate(15, 56)" class="hud-text" font-size="14.5">
      <text y="0" fill="#8b949e">HOSTNAME:</text>
      <text x="125" y="0" fill="#c9d1d9" font-weight="bold">vps01.thesci.co.in</text>

      <text y="28" fill="#8b949e">OS PLATFORM:</text>
      <text x="125" y="28" fill="#00ff41" font-weight="bold">Ubuntu 24.04 LTS</text>

      <text y="56" fill="#8b949e">DATA HUB:</text>
      <text x="125" y="56" fill="#c9d1d9">Ranchi, Jharkhand (IN)</text>

      <text y="84" fill="#8b949e">KERNEL CORE:</text>
      <text x="125" y="84" fill="#c9d1d9">Linux 6.8.0-generic</text>

      <text y="112" fill="#8b949e">CLEARANCE:</text>
      <text x="125" y="112" fill="#00f0ff" font-weight="bold">MCA Pvt Ltd (Feb 2026)</text>

      <text y="140" fill="#8b949e">NODE STATUS:</text>
      <text x="125" y="140" fill="#00ff41" font-weight="bold">[ONLINE · SOVEREIGN]</text>
    </g>
  </g>

  <!-- PANEL 2: RESOURCE TELEMETRY (Center) -->
  <g transform="translate(410, 58)">
    <rect width="380" height="225" rx="5" fill="#090e18" stroke="#1f293d" stroke-width="1.1" />
    <path d="M 0 5 Q 0 0 5 0 L 375 0 Q 380 0 380 5 L 380 32 L 0 32 Z" fill="#0e1726" />
    <text x="14" y="22" fill="#00ff41" class="hud-text" font-size="14" font-weight="bold" letter-spacing="1">
      [02] LIVE RESOURCE TELEMETRY
    </text>

    <!-- Telemetry Bars (+25% font size: 14px) -->
    <g transform="translate(15, 52)" class="hud-text">
      <!-- CPU -->
      <text y="14" fill="#8b949e" font-size="13.5">CPU CORE:</text>
      <text x="350" y="14" fill="#00ff41" font-size="14" font-weight="bold" text-anchor="end">14%</text>
      <rect x="110" y="2" width="180" height="15" rx="3" fill="#060a12" stroke="#1f293d" />
      <rect x="111" y="3" width="60" height="13" rx="2" fill="#00ff41" class="cpu-anim" />

      <!-- RAM -->
      <text y="44" fill="#8b949e" font-size="13.5">RAM IDLE:</text>
      <text x="350" y="44" fill="#00f0ff" font-size="14" font-weight="bold" text-anchor="end">~15 MB</text>
      <rect x="110" y="32" width="180" height="15" rx="3" fill="#060a12" stroke="#1f293d" />
      <rect x="111" y="33" width="30" height="13" rx="2" fill="#00f0ff" />

      <!-- DISK -->
      <text y="74" fill="#8b949e" font-size="13.5">STORAGE:</text>
      <text x="350" y="74" fill="#c9d1d9" font-size="14" font-weight="bold" text-anchor="end">51%</text>
      <rect x="110" y="62" width="180" height="15" rx="3" fill="#060a12" stroke="#1f293d" />
      <rect x="111" y="63" width="130" height="13" rx="2" fill="#3b82f6" class="disk-anim" />

      <!-- NETWORK -->
      <text y="104" fill="#8b949e" font-size="13.5">NETWORK:</text>
      <text x="350" y="104" fill="#00ff41" font-size="14" font-weight="bold" text-anchor="end">1 Gbps</text>
      <rect x="110" y="92" width="180" height="15" rx="3" fill="#060a12" stroke="#1f293d" />
      <rect x="111" y="93" width="85" height="13" rx="2" fill="#10b981" class="net-anim" />

      <!-- Note about RAM -->
      <text y="145" fill="#00f0ff" font-size="12.5" font-weight="bold">
        ⚡ COMPILED GO CORE: 90% LESS RAM THAN cPANEL
      </text>
    </g>
  </g>

  <!-- PANEL 3: ACTIVE DAEMONS & SENTINELS (Right) -->
  <g transform="translate(815, 58)">
    <rect width="360" height="225" rx="5" fill="#090e18" stroke="#1f293d" stroke-width="1.1" />
    <path d="M 0 5 Q 0 0 5 0 L 355 0 Q 360 0 360 5 L 360 32 L 0 32 Z" fill="#0e1726" />
    <text x="14" y="22" fill="#00f0ff" class="hud-text" font-size="14" font-weight="bold" letter-spacing="1">
      [03] ACTIVE DAEMON SENTINELS
    </text>

    <!-- Services list (+25% font size: 14px) -->
    <g transform="translate(15, 54)" class="hud-text" font-size="14">
      <g transform="translate(0, 0)">
        <circle cx="6" cy="6" r="4" fill="#00ff41" class="led-g" />
        <text x="20" y="10" fill="#c9d1d9">Caddy 2 HTTP/3 Auto-TLS</text>
        <text x="330" y="10" text-anchor="end" fill="#00ff41" font-weight="bold">:443</text>
      </g>
      <g transform="translate(0, 26)">
        <circle cx="6" cy="6" r="4" fill="#00ff41" class="led-g" />
        <text x="20" y="10" fill="#c9d1d9">PowerDNS MariaDB Backend</text>
        <text x="330" y="10" text-anchor="end" fill="#00ff41" font-weight="bold">:53</text>
      </g>
      <g transform="translate(0, 52)">
        <circle cx="6" cy="6" r="4" fill="#00ff41" class="led-g" />
        <text x="20" y="10" fill="#c9d1d9">Postfix &amp; Dovecot Cluster</text>
        <text x="330" y="10" text-anchor="end" fill="#00ff41" font-weight="bold">:25/:993</text>
      </g>
      <g transform="translate(0, 78)">
        <circle cx="6" cy="6" r="4" fill="#00f0ff" class="led-c" />
        <text x="20" y="10" fill="#c9d1d9">MariaDB InnoDB SQL Engine</text>
        <text x="330" y="10" text-anchor="end" fill="#00f0ff" font-weight="bold">:3306</text>
      </g>
      <g transform="translate(0, 104)">
        <circle cx="6" cy="6" r="4" fill="#00ff41" class="led-g" />
        <text x="20" y="10" fill="#c9d1d9">Helios Go Core Supervisor</text>
        <text x="330" y="10" text-anchor="end" fill="#00ff41" font-weight="bold">:8080</text>
      </g>
      <g transform="translate(0, 130)">
        <circle cx="6" cy="6" r="4" fill="#00f0ff" class="led-c" />
        <text x="20" y="10" fill="#c9d1d9">TrustSign SHA-256 Authority</text>
        <text x="330" y="10" text-anchor="end" fill="#00f0ff" font-weight="bold">:8443</text>
      </g>
    </g>
  </g>

  <!-- Bottom Status Footer Strip (+25% font size: 14px) -->
  <g transform="translate(25, 316)" class="hud-text" font-size="14">
    <text fill="#8b949e">THREAT MODEL: <tspan fill="#00ff41" font-weight="bold">ZERO-TRUST LINUX HARDENED</tspan></text>
    <text x="430" fill="#8b949e">DATA SOVEREIGNTY: <tspan fill="#00f0ff" font-weight="bold">100% PRIVATE HOSTING</tspan></text>
    <text x="890" fill="#8b949e">LICENSE OVERHEAD: <tspan fill="#00ff41" font-weight="bold">$0 PER-SEAT TAX</tspan></text>
  </g>

  <!-- Scanline Overlay -->
  <rect width="1200" height="340" fill="url(#dashScan)" pointer-events="none" />
</svg>
