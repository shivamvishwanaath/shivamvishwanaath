<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="topoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>

    <!-- Node Glow -->
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Micro-Grid Pattern -->
    <pattern id="pcbGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.4" opacity="0.06" />
    </pattern>
  </defs>

  <style>
    @keyframes dashFlow {
      to { stroke-dashoffset: -32; }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #00ff41); }
      50% { transform: scale(1.015); filter: drop-shadow(0 0 14px #00ff41); }
    }
    @keyframes pulseNodeLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes packetMove1 {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(0, -95px); opacity: 0; }
    }
    @keyframes packetMove2 {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(-280px, 0); opacity: 0; }
    }
    @keyframes packetMove3 {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(280px, 0); opacity: 0; }
    }
    @keyframes packetMove4 {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(-260px, 95px); opacity: 0; }
    }
    @keyframes packetMove5 {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(0, 95px); opacity: 0; }
    }
    @keyframes packetMove6 {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(260px, 95px); opacity: 0; }
    }

    .topo-font { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashFlow 1.8s linear infinite;
    }
    .flow-line-rev {
      stroke-dasharray: 8 6;
      animation: dashFlow 1.8s linear infinite reverse;
    }
    .core-node { transform-origin: 600px 175px; animation: pulseCore 3s ease-in-out infinite; }
    .node-led { animation: pulseNodeLed 2s infinite ease-in-out; }
    
    .pkt1 { animation: packetMove1 2s linear infinite; }
    .pkt2 { animation: packetMove2 2.5s linear infinite; }
    .pkt3 { animation: packetMove3 2.5s linear infinite; }
    .pkt4 { animation: packetMove4 2.8s linear infinite; }
    .pkt5 { animation: packetMove5 2.2s linear infinite; }
    .pkt6 { animation: packetMove6 2.8s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="8" fill="url(#topoBg)" stroke="#1f293d" stroke-width="1.2" />
  <rect width="1200" height="360" fill="url(#pcbGrid)" />

  <!-- Circuit Trace Header Title -->
  <g transform="translate(30, 30)">
    <text fill="#00f0ff" class="topo-font" font-size="12" font-weight="bold" letter-spacing="1.5">
      SYSTEM CIRCUIT TOPOLOGY // HELIOS ENTERPRISE ARCHITECTURE
    </text>
    <text x="1140" fill="#8b949e" text-anchor="end" class="topo-font" font-size="11">
      PROTOCOL: COMPILED IPC · ZERO PER-SEAT OVERHEAD
    </text>
  </g>

  <!-- CIRCUIT WIRES / BUSSES (Underneath Nodes) -->
  <g fill="none" stroke="#00ff41" stroke-width="2" opacity="0.8">
    <!-- Center to Top (Caddy) -->
    <line x1="600" y1="135" x2="600" y2="75" class="flow-line-rev" />

    <!-- Center to Left (PowerDNS) -->
    <line x1="460" y1="175" x2="280" y2="175" class="flow-line-rev" />

    <!-- Center to Right (Postfix) -->
    <line x1="740" y1="175" x2="920" y2="175" class="flow-line" />

    <!-- Center to Bottom-Left (MariaDB) -->
    <path d="M 520 215 L 520 255 L 260 255 L 260 280" class="flow-line" />

    <!-- Center to Bottom-Center (TrustSign) -->
    <line x1="600" y1="215" x2="600" y2="280" class="flow-line" />

    <!-- Center to Bottom-Right (Suites) -->
    <path d="M 680 215 L 680 255 L 940 255 L 940 280" class="flow-line" />
  </g>

  <!-- Data Packet Pulses -->
  <g fill="#00f0ff" filter="url(#nodeGlow)">
    <circle cx="600" cy="170" r="4" class="pkt1" />
    <circle cx="580" cy="175" r="4" class="pkt2" />
    <circle cx="620" cy="175" r="4" class="pkt3" />
    <circle cx="580" cy="190" r="4" class="pkt4" />
    <circle cx="600" cy="190" r="4" class="pkt5" />
    <circle cx="620" cy="190" r="4" class="pkt6" />
  </g>

  <!-- NODE: TOP — CADDY 2 REVERSE PROXY -->
  <g transform="translate(460, 40)">
    <rect width="280" height="50" rx="6" fill="#0d1424" stroke="#00f0ff" stroke-width="1.4" />
    <circle cx="16" cy="16" r="3.5" fill="#00f0ff" class="node-led" />
    <text x="28" y="20" fill="#ffffff" class="topo-font" font-size="12" font-weight="bold">CADDY 2 REVERSE PROXY</text>
    <text x="28" y="36" fill="#00f0ff" class="topo-font" font-size="10">PORT :443 · HTTP/3 · AUTOMATED SSL</text>
  </g>

  <!-- NODE: LEFT — POWERDNS -->
  <g transform="translate(40, 150)">
    <rect width="240" height="50" rx="6" fill="#0d1424" stroke="#00ff41" stroke-width="1.4" />
    <circle cx="16" cy="16" r="3.5" fill="#00ff41" class="node-led" />
    <text x="28" y="20" fill="#ffffff" class="topo-font" font-size="12" font-weight="bold">POWERDNS NATIVE</text>
    <text x="28" y="36" fill="#00ff41" class="topo-font" font-size="10">PORT :53 · MARIADB ZONE SYNC</text>
  </g>

  <!-- NODE: RIGHT — POSTFIX & DOVECOT -->
  <g transform="translate(920, 150)">
    <rect width="240" height="50" rx="6" fill="#0d1424" stroke="#00ff41" stroke-width="1.4" />
    <circle cx="16" cy="16" r="3.5" fill="#00ff41" class="node-led" />
    <text x="28" y="20" fill="#ffffff" class="topo-font" font-size="12" font-weight="bold">POSTFIX &amp; DOVECOT</text>
    <text x="28" y="36" fill="#00ff41" class="topo-font" font-size="10">PORT :25 · DKIM / SPF / DMARC</text>
  </g>

  <!-- NODE: CENTER (FLAGSHIP CORE) — HELIOS COMPILED GO CORE -->
  <g class="core-node" transform="translate(460, 135)">
    <rect width="280" height="80" rx="8" fill="#08101e" stroke="#00ff41" stroke-width="2.2" />
    <rect x="4" y="4" width="272" height="72" rx="6" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.6" />
    <circle cx="20" cy="22" r="4.5" fill="#00ff41" class="node-led" />
    <text x="32" y="26" fill="#00ff41" class="topo-font" font-size="13" font-weight="900" letter-spacing="1">
      HELIOS COMPILED GO CORE
    </text>
    <text x="32" y="46" fill="#ffffff" class="topo-font" font-size="11" font-weight="bold">
      Footprint: ~15 MB RAM Idle
    </text>
    <text x="32" y="64" fill="#00f0ff" class="topo-font" font-size="10">
      Zero Runtime Deps · Single Binary
    </text>
  </g>

  <!-- NODE: BOTTOM LEFT — MARIADB INNODB -->
  <g transform="translate(140, 280)">
    <rect width="240" height="52" rx="6" fill="#0d1424" stroke="#00f0ff" stroke-width="1.4" />
    <circle cx="16" cy="16" r="3.5" fill="#00f0ff" class="node-led" />
    <text x="28" y="20" fill="#ffffff" class="topo-font" font-size="12" font-weight="bold">MARIADB STORAGE</text>
    <text x="28" y="36" fill="#00f0ff" class="topo-font" font-size="10">PORT :3306 · 100% PRIVATE DATA</text>
  </g>

  <!-- NODE: BOTTOM CENTER — TRUSTSIGN E-SIGN -->
  <g transform="translate(460, 280)">
    <rect width="280" height="52" rx="6" fill="#0d1424" stroke="#00ff41" stroke-width="1.4" />
    <circle cx="16" cy="16" r="3.5" fill="#00ff41" class="node-led" />
    <text x="28" y="20" fill="#ffffff" class="topo-font" font-size="12" font-weight="bold">TRUSTSIGN AUTHORITY</text>
    <text x="28" y="36" fill="#00ff41" class="topo-font" font-size="10">SHA-256 PDF HASHING · OTP 2FA</text>
  </g>

  <!-- NODE: BOTTOM RIGHT — 5 AUTONOMOUS SUITES -->
  <g transform="translate(820, 280)">
    <rect width="260" height="52" rx="6" fill="#0d1424" stroke="#00f0ff" stroke-width="1.4" />
    <circle cx="16" cy="16" r="3.5" fill="#00f0ff" class="node-led" />
    <text x="28" y="20" fill="#ffffff" class="topo-font" font-size="12" font-weight="bold">5 AUTONOMOUS SUITES</text>
    <text x="28" y="36" fill="#00f0ff" class="topo-font" font-size="10">CRM · HRMS · PM · SUPPORT</text>
  </g>
</svg>
