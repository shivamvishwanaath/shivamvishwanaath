<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
  </defs>

  <style>
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes lineFade1 { 0% { opacity: 0; } 10%, 100% { opacity: 1; } }
    @keyframes lineFade2 { 0%, 10% { opacity: 0; } 20%, 100% { opacity: 1; } }
    @keyframes lineFade3 { 0%, 25% { opacity: 0; } 35%, 100% { opacity: 1; } }
    @keyframes lineFade4 { 0%, 40% { opacity: 0; } 50%, 100% { opacity: 1; } }
    @keyframes lineFade5 { 0%, 55% { opacity: 0; } 65%, 100% { opacity: 1; } }
    @keyframes lineFade6 { 0%, 70% { opacity: 0; } 80%, 100% { opacity: 1; } }
    @keyframes lineFade7 { 0%, 85% { opacity: 0; } 95%, 100% { opacity: 1; } }

    .term-font { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .cursor { animation: cursorBlink 1s infinite; fill: #00ff41; }
    .prompt { fill: #00ff41; font-weight: bold; }
    .cmd { fill: #ffffff; font-weight: bold; }
    .out-dim { fill: #8b949e; }
    .out-green { fill: #00ff41; font-weight: bold; }
    .out-cyan { fill: #00f0ff; font-weight: bold; }

    .l1 { animation: lineFade1 10s infinite; }
    .l2 { animation: lineFade2 10s infinite; }
    .l3 { animation: lineFade3 10s infinite; }
    .l4 { animation: lineFade4 10s infinite; }
    .l5 { animation: lineFade5 10s infinite; }
    .l6 { animation: lineFade6 10s infinite; }
    .l7 { animation: lineFade7 10s infinite; }
  </style>

  <!-- Terminal Window Frame -->
  <rect width="1200" height="380" rx="8" fill="url(#termBg)" stroke="#1f293d" stroke-width="1.2" />

  <!-- Top Bar -->
  <path d="M 0 8 Q 0 0 8 0 L 1192 0 Q 1200 0 1200 8 L 1200 38 L 0 38 Z" fill="#0d1424" stroke="#1f293d" stroke-width="0.8" />
  <circle cx="24" cy="19" r="6" fill="#ff5f56" />
  <circle cx="42" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="19" r="6" fill="#27c93f" />
  <text x="82" y="24" fill="#8b949e" class="term-font" font-size="14" font-weight="600">
    shivam@solcielo-vps: ~ (zsh) — 1200x380
  </text>
  <text x="1175" y="24" text-anchor="end" fill="#00ff41" class="term-font" font-size="13.5" font-weight="bold">
    [TTY: /dev/pts/0 · ENCRYPTED]
  </text>

  <!-- Content Lines (25% larger text: 15.5px) -->
  <g transform="translate(30, 75)" class="term-font" font-size="15.5">
    <!-- Line 1: whoami -->
    <g class="l1">
      <text y="0"><tspan class="prompt">shivam@solcielo:~$</tspan> <tspan class="cmd">whoami</tspan></text>
      <text y="26" class="out-cyan">shivam.vishwanaath // Founder &amp; CEO @ The SCI SolCielo Innovacion Pvt Ltd™ (MCA India, Feb 2026)</text>
    </g>

    <!-- Line 2: cat stack -->
    <g class="l2" transform="translate(0, 60)">
      <text y="0"><tspan class="prompt">shivam@solcielo:~$</tspan> <tspan class="cmd">cat /etc/core-stack.conf</tspan></text>
      <text y="26" class="out-dim">LANG=<tspan class="out-green">Go,TypeScript,Python,C/C++</tspan>  FRAMEWORK=<tspan class="out-green">Fiber_v2,Next.js_15,HTMX</tspan>  DB=<tspan class="out-cyan">MariaDB,PostgreSQL,MongoDB</tspan></text>
      <text y="50" class="out-dim">INFRA=<tspan class="out-green">Ubuntu_BareMetal_VPS</tspan>  PROXY=<tspan class="out-cyan">Caddy2_HTTP/3_AutoTLS</tspan>  DNS=<tspan class="out-green">PowerDNS_MariaDB_Backend</tspan></text>
    </g>

    <!-- Line 3: helios status -->
    <g class="l4" transform="translate(0, 145)">
      <text y="0"><tspan class="prompt">shivam@solcielo:~$</tspan> <tspan class="cmd">helios --status --all-suites</tspan></text>
      <text y="26" class="out-dim">[✓] <tspan class="out-green">Helios-Cloud-Engine</tspan> (~15MB RAM idle)  [✓] <tspan class="out-cyan">Helios-CRM</tspan> (Sales Pipeline &amp; Quotes)  [✓] <tspan class="out-green">Helios-HRMS</tspan> (Payroll)</text>
      <text y="50" class="out-dim">[✓] <tspan class="out-cyan">Helios-PM</tspan> (Kanban &lt;50ms)           [✓] <tspan class="out-green">Helios-Support</tspan> (SLA Helpdesk)          [✓] <tspan class="out-cyan">TrustSign</tspan> (SHA-256 eSign)</text>
    </g>

    <!-- Line 4: clear status -->
    <g class="l6" transform="translate(0, 230)">
      <text y="0"><tspan class="prompt">shivam@solcielo:~$</tspan> <tspan class="cmd">echo $CLEARANCE_STATUS</tspan></text>
      <text y="26" class="out-green">ACTIVE — Evaluating Technical Leadership, Senior Full-Stack Engineering &amp; Systems Architecture Opportunities</text>
    </g>

    <!-- Line 5: Prompt with Blinking Cursor -->
    <g class="l7" transform="translate(0, 288)">
      <text y="0"><tspan class="prompt">shivam@solcielo:~$</tspan> <tspan fill="#ffffff">_</tspan></text>
      <rect x="215" y="-15" width="10" height="19" class="cursor" />
    </g>
  </g>
</svg>
